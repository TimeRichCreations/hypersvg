<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 280" width="100" height="280" data-hsvg-version="2.0">
  <title>Bar</title>
  <defs>
    <linearGradient id="bar__shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9a9c"/>
      <stop offset="0.1" stop-color="#6ad6d0"/>
      <stop offset="0.24" stop-color="#2bb0ae"/>
      <stop offset="0.7" stop-color="#168e91"/>
      <stop offset="1" stop-color="#0b5f63"/>
    </linearGradient>
    <pattern id="bar__flutes" patternUnits="userSpaceOnUse" x="10" y="0" width="6" height="10">
      <rect x="0" y="0" width="1" height="10" fill="#ffffff" opacity="0.22"/>
      <rect x="3" y="0" width="1" height="10" fill="#063c40" opacity="0.18"/>
    </pattern>
    <radialGradient id="bar__contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a2410" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a2410" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bar" data-hsvg-kind="component" data-hsvg-pivot="0 0">
    <ellipse cx="72" cy="249" rx="44" ry="8" fill="url(#bar__contact)"/>
    <path d="M90 250L112 250L100 243L90 243z" fill="#3a2410" opacity="0.3"/>
    <g id="bar__fill" data-hsvg-kind="part" data-hsvg-pivot="50 250" data-hsvg-motion="scale-y 0..1">
      <rect x="10" y="50" width="80" height="200" fill="url(#bar__shade)"/>
      <rect x="10" y="50" width="80" height="200" fill="url(#bar__flutes)"/>
      <rect x="10" y="50" width="80" height="200" fill="none" stroke="#0b4f53" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="M11 248H89" stroke="#063c40" stroke-width="4" opacity="0.45" vector-effect="non-scaling-stroke"/>
      <path d="M11 50H89" stroke="#c8f4ee" stroke-width="5" vector-effect="non-scaling-stroke"/>
      <path d="M12 50H40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
    <text id="bar__name" data-hsvg-kind="part" x="50" y="274" text-anchor="middle"
