<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" data-hsvg-version="2.0" data-hsvg-kind="screen">
  <title>Fruit we picked</title>
  <desc>Art direction for Fruit we picked. Palette: ground #b98a5a warm wood table; surface #fffaf0 cream paper card; ink #153b4b titles and labels, #2f4650 axis text; accent #168e91 teal bars (light #6ad6d0, shade #0b5f63); fruit reds, greens and plums as small spots of colour; shade #5a3e22. Light comes from the upper left: lit edges face up and left, shadows fall down and right. Line weight 2 for outlines and axis, 1 for gridlines. Shape language crisp and tidy: straight bars on an 8-unit grid, small rounded corners (radius 8) on the card and badges, round fruit.</desc>
  <defs>
    <linearGradient id="chart-wood" gradientUnits="userSpaceOnUse" x1="0" y1="-200" x2="0" y2="600">
      <stop offset="0" stop-color="#9c7046"/>
      <stop offset="0.5" stop-color="#b98a5a"/>
      <stop offset="1" stop-color="#8a6038"/>
    </linearGradient>
    <radialGradient id="chart-light" cx="120" cy="40" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a2410" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="chart-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f7eedb"/>
    </linearGradient>
    <linearGradient id="chart-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f2ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d6e8e4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chart-tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6af42" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f2c96a" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="chart-apple" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.5" stop-color="#d9362f"/>
      <stop offset="1" stop-color="#8e1c1a"/>
    </radialGradient>
    <radialGradient id="chart-pear" cx="0.35" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#eef28a"/>
      <stop offset="0.55" stop-color="#b6c83a"/>
      <stop offset="1" stop-color="#6e8420"/>
    </radialGradient>
    <radialGradient id="chart-plum" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b48ce0"/>
      <stop offset="0.55" stop-color="#6a3c9c"/>
      <stop offset="1" stop-color="#3a1f5c"/>
    </radialGradient>
    <radialGradient id="chart-fig" cx="0.35" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c88aa0"/>
      <stop offset="0.55" stop-color="#7a3a58"/>
      <stop offset="1" stop-color="#46203a"/>
    </radialGradient>
    <radialGradient id="chart-badge" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e8d0"/>
    </radialGradient>
    <linearGradient id="chart-basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a35e"/>
      <stop offset="1" stop-color="#9c6a34"/>
    </linearGradient>
    <pattern id="chart-woodgrain" patternUnits="userSpaceOnUse" x="0" y="0" width="240" height="40">
      <path d="M0 6C40 3 80 9 120 6S200 3 240 6" fill="none" stroke="#7a5230" stroke-width="1.2" opacity="0.45"/>
      <path d="M0 15C30 18 70 12 120 15S190 19 240 15" fill="none" stroke="#6a4424" stroke-width="0.8" opacity="0.35"/>
      <path d="M0 24C50 22 90 27 140 24S210 21 240 24" fill="none" stroke="#7a5230" stroke-width="1.5" opacity="0.4"/>
      <path d="M0 33C40 35 100 30 150 33S220 35 240 33" fill="none" stroke="#d9a878" stroke-width="1" opacity="0.4"/>
      <ellipse cx="170" cy="24" rx="10" ry="3" fill="none" stroke="#6a4424" stroke-width="1" opacity="0.4"/>
    </pattern>
    <pattern id="chart-fibre" patternUnits="userSpaceOnUse" x="0" y="0" width="72" height="56">
      <path d="M4 8l9 2M30 4l6 5M52 12l10 -3M14 26l7 4M40 22l11 1M60 34l6 6M6 44l10 -2M28 40l5 7M46 50l9 -1" fill="none" stroke="#b49a6a" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
      <path d="M20 14l4 -3M64 20l3 4M34 32l-5 3M56 46l4 -4M10 34l3 3" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
      <circle cx="24" cy="50" r="0.8" fill="#9c8250" opacity="0.6"/><circle cx="66" cy="6" r="0.7" fill="#9c8250" opacity="0.6"/><circle cx="44" cy="38" r="0.6" fill="#9c8250" opacity="0.6"/>
    </pattern>
    <filter id="chart-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="fibre"/>
      <feColorMatrix in="fibre" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0.5 -0.2" result="speck"/>
      <feComposite in="speck" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="chart-card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="3" dy="6" stdDeviation="6"/>
    </filter>
    <filter id="chart-small-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5"/>
    </filter>
  </defs>
  <g id="paper" data-hsvg-layer="backdrop">
    <rect x="-320" y="-200" width="1280" height="800" fill="url(#chart-wood)"/>
    <rect x="-320" y="-200" width="1280" height="800" fill="url(#chart-woodgrain)"/>
    <g stroke="#7a5230" stroke-width="2" opacity="0.5">
      <path d="M-320 -40H960M-320 120H960M-320 280H960M-320 440H960"/>
    </g>
    <rect x="-320" y="-200" width="1280" height="800" fill="url(#chart-light)"/>
  </g>
  <g id="card" data-hsvg-layer="decoration">
    <rect x="16" y="16" width="608" height="368" rx="8" fill="url(#chart-card)" filter="url(#chart-card-shadow)"/>
    <rect x="16" y="16" width="608" height="368" rx="8" fill="#ffffff" filter="url(#chart-paper)" opacity="0.5"/>
    <rect x="16" y="16" width="608" height="368" rx="8" fill="url(#chart-fibre)"/>
    <rect x="22" y="22" width="596" height="356" rx="5" fill="none" stroke="#e3d4b4" stroke-width="1"/>
    <!-- tape at two corners -->
    <rect x="14" y="14" width="56" height="18" fill="url(#chart-tape)" transform="rotate(-30 42 23)"/>
    <rect x="570" y="364" width="56" height="18" fill="url(#chart-tape)" transform="rotate(-30 598 373)"/>
    <!-- title rule -->
    <path d="M40 64H184" stroke="#e6af42" stroke-width="4" stroke-linecap="round"/>
    <!-- a basket of fruit, top right -->
    <g transform="translate(528 30)">
      <ellipse cx="40" cy="68" rx="40" ry="5" fill="#5a3e22" opacity="0.2"/>
      <circle cx="26" cy="30" r="12" fill="url(#chart-apple)" stroke="#5a1410" stroke-width="1.5"/>
      <path d="M26 18c1 -5 3 -7 6 -8" fill="none" stroke="#5a3e22" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 14c5 -4 10 -3 12 0c-4 3 -9 3 -12 0z" fill="#4f8a2e"/>
      <circle cx="46" cy="32" r="10" fill="url(#chart-plum)" stroke="#2a1440" stroke-width="1.5"/>
      <path d="M58 34c-6 0 -8 -10 -4 -16c2 -4 2 -6 4 -8c2 2 2 4 4 8c4 6 2 16 -4 16z" fill="url(#chart-pear)" stroke="#4a5a14" stroke-width="1.5"/>
      <path d="M8 36H72L64 66H16z" fill="url(#chart-basket)" stroke="#6a4420" stroke-width="2" stroke-linejoin="round"/>
      <path d="M11 44H69M13 52H67M15 60H65" stroke="#7a5228" stroke-width="1.5" opacity="0.7"/>
      <path d="M24 36L22 66M40 36V66M56 36L58 66" stroke="#7a5228" stroke-width="1.5" opacity="0.7"/>
      <path d="M6 34H74" stroke="#b07a3e" stroke-width="5" stroke-linecap="round"/>
      <path d="M8 33H40" stroke="#f0c890" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- gridlines every 25 percent, 50 units apart -->
    <g stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 4">
      <path d="M40 130H572M40 180H572M40 230H572M40 280H572"/>
    </g>
    <g font-family="sans-serif" font-size="14" fill="#2f4650" text-anchor="end">
      <text x="612" y="135">100%</text>
      <text x="612" y="185">75%</text>
      <text x="612" y="235">50%</text>
      <text x="612" y="285">25%</text>
      <text x="612" y="335">0%</text>
    </g>
    <!-- full-height tracks behind each bar -->
    <g fill="url(#chart-track)">
      <rect x="70" y="130" width="80" height="200"/>
      <rect x="210" y="130" width="80" height="200"/>
      <rect x="350" y="130" width="80" height="200"/>
      <rect x="490" y="130" width="80" height="200"/>
    </g>
  </g>
  <g id="content" data-hsvg-layer="content">
    <text x="40" y="50" font-family="sans-serif" font-size="28" font-weight="700" fill="#153b4b">Fruit we picked</text>
    <path d="M40 330H572" stroke="#153b4b" stroke-width="2"/>
    <g id="bars" data-hsvg-kind="part" data-hsvg-repeat="">
    <g id="bar-1" data-hsvg-kind="part" data-hsvg-slot="bar-1" transform="translate(60 80)"/>
    <g id="bar-2" data-hsvg-kind="part" data-hsvg-slot="bar-2" transform="translate(200 80)"/>
    <g id="bar-3" data-hsvg-kind="part" data-hsvg-slot="bar-3" transform="translate(340 80)"/>
    <g id="bar-4" data-hsvg-kind="part" data-hsvg-slot="bar-4" transform="translate(480 80)"/>
    </g>
  </g>
  <g id="fruit-badges" data-hsvg-layer="overlay">
    <!-- one small fruit at the foot of each bar, in the table's row order -->
    <g transform="translate(110 314)">
      <circle r="12" fill="url(#chart-badge)" stroke="#0b4f53" stroke-width="2" filter="url(#chart-small-shadow)"/>
      <circle cy="1.5" r="7" fill="url(#chart-apple)" stroke="#5a1410" stroke-width="1"/>
      <path d="M0 -5c0 -2 1 -3 2 -4" fill="none" stroke="#5a3e22" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M1.5 -7c2.5 -2 5 -1.5 6 0c-2 1.5 -4 1.5 -6 0z" fill="#4f8a2e"/>
      <circle cx="-2.5" cy="-1" r="1.5" fill="#ffffff" opacity="0.8"/>
    </g>
    <g transform="translate(250 314)">
      <circle r="12" fill="url(#chart-badge)" stroke="#0b4f53" stroke-width="2" filter="url(#chart-small-shadow)"/>
      <path d="M0 9c-6 0 -7 -6 -4 -10c1.5 -2 2 -4 4 -5c2 1 2.5 3 4 5c3 4 2 10 -4 10z" fill="url(#chart-pear)" stroke="#4a5a14" stroke-width="1"/>
      <path d="M0 -6c0 -2 1 -3 2 -4" fill="none" stroke="#5a3e22" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-2" cy="2" r="1.4" fill="#ffffff" opacity="0.7"/>
    </g>
    <g transform="translate(390 314)">
      <circle r="12" fill="url(#chart-badge)" stroke="#0b4f53" stroke-width="2" filter="url(#chart-small-shadow)"/>
      <ellipse cy="1.5" rx="6.5" ry="7.5" fill="url(#chart-plum)" stroke="#2a1440" stroke-width="1"/>
      <path d="M0 -5c1 2 1 8 0 13" fill="none" stroke="#3a1f5c" stroke-width="1" opacity="0.7"/>
      <path d="M0 -6c0 -2 -1 -3 -2 -4" fill="none" stroke="#5a3e22" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-2.5" cy="-1" r="1.4" fill="#ffffff" opacity="0.7"/>
    </g>
    <g transform="translate(530 314)">
      <circle r="12" fill="url(#chart-badge)" stroke="#0b4f53" stroke-width="2" filter="url(#chart-small-shadow)"/>
      <path d="M0 -6c2 3 7 6 7 10c0 4 -3 5 -7 5c-4 0 -7 -1 -7 -5c0 -4 5 -7 7 -10z" fill="url(#chart-fig)" stroke="#2e1426" stroke-width="1"/>
      <path d="M0 -6v-3" stroke="#4f8a2e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-2.5" cy="2" r="1.4" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
