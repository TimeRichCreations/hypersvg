<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" data-hsvg-version="2.0" data-hsvg-kind="screen">
<title>K2b marks</title>
<rect width="400" height="300" fill="#f3f4f6" data-hsvg-layer="backdrop"/>
<svg id="badge" data-hsvg-kind="part" data-hsvg-role="icon" data-hsvg-label="Status" x="20" y="20" width="48" height="48" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#9ca3af"/></svg>
<g id="bike-spot" data-hsvg-kind="part" data-hsvg-slot="bike-spot" transform="translate(120 120)"/>
<g id="parcel-home" data-hsvg-kind="part" data-hsvg-slot="parcel-home" transform="translate(60 150)"/>
<g id="load" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Load"><rect x="150" y="220" width="50" height="48" rx="8" fill="#d1d5db"/></g>
<g id="home" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Home slot"><rect x="210" y="220" width="50" height="48" rx="8" fill="#d1d5db"/></g>
<g id="off" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Take off"><rect x="270" y="220" width="50" height="48" rx="8" fill="#d1d5db"/></g>
<g id="ride" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Ride"><rect x="330" y="220" width="50" height="48" rx="8" fill="#d1d5db"/></g>
<g id="next" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Next icon"><rect x="20" y="220" width="120" height="48" rx="8" fill="#d1d5db"/></g>
