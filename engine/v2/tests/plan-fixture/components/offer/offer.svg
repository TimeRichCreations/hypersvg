<text id="offer__offer-title" data-hsvg-kind="part" x="10" y="40" font-family="sans-serif" font-size="24" fill="#153b4b">Summer sale</text>
<rect id="offer__photo-slot" data-hsvg-kind="part" data-hsvg-slot="photo" x="10" y="60" width="280" height="120" fill="none"/>
