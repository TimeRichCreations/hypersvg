<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" data-hsvg-version="2.0" data-hsvg-kind="screen">
<title>Bakery ad 300x250</title>
<rect width="300" height="250" fill="#fff4d8" data-hsvg-layer="backdrop"/>
<g id="logo" data-hsvg-kind="part">
<circle cx="40" cy="40" r="25" fill="#0f6f72"/>
<g id="sparkle" data-hsvg-kind="part" data-hsvg-layer="decoration"><circle cx="55" cy="25" r="4" fill="#e6af42"/></g>
<rect id="brand-box" data-hsvg-kind="part" data-hsvg-fit="" x="75" y="22" width="210" height="36" fill="none"/>
<text id="brand" data-hsvg-kind="part" x="75" y="41" font-family="sans-serif" font-size="22" fill="#153b4b">Harbour Bakery</text>
</g>
<rect id="headline-box" data-hsvg-kind="part" data-hsvg-fit="" x="20" y="80" width="270" height="100" fill="none"/>
<text id="headline" data-hsvg-kind="part" x="20" y="102" font-family="sans-serif" font-size="26" fill="#153b4b">Headline</text>
<rect id="legal-box" data-hsvg-kind="part" data-hsvg-fit="" x="20" y="200" width="260" height="36" fill="none"/>
<text id="legal" data-hsvg-kind="part" x="20" y="212" font-family="sans-serif" font-size="14" fill="#4f6b73">Legal</text>
</svg>
