<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" data-hsvg-version="2.0" data-hsvg-kind="screen">
<title>E1 controls</title>
<defs><clipPath id="pill"><rect x="20" y="20" width="300" height="60" rx="30"/></clipPath></defs>
<rect width="640" height="560" fill="#f3f4f6" data-hsvg-layer="backdrop" data-hsvg-color="surface"/>
<g id="sun" data-hsvg-kind="part" data-hsvg-label="A sun"><circle cx="600" cy="40" r="20" fill="#f59e0b"/></g>
<g id="panel" data-hsvg-kind="part" data-hsvg-label="Size panel">
  <rect x="20" y="20" width="300" height="60" rx="30" fill="#d1d5db"/>
  <g clip-path="url(#pill)">
    <g id="size-s" data-hsvg-kind="part"><rect x="20" y="20" width="100" height="60" fill="#bfdbfe"/><text x="70" y="57" text-anchor="middle" font-size="20" fill="#111827">S</text></g>
    <g id="size-m" data-hsvg-kind="part"><rect x="120" y="20" width="100" height="60" fill="#93c5fd"/><text x="170" y="57" text-anchor="middle" font-size="20" fill="#111827">M</text></g>
    <g id="size-l" data-hsvg-kind="part"><rect x="220" y="20" width="100" height="60" fill="#bfdbfe"/><text x="270" y="57" text-anchor="middle" font-size="20" fill="#111827">L</text></g>
  </g>
</g>
<g id="moods" data-hsvg-kind="part">
  <g id="mood-a" data-hsvg-kind="part"><circle cx="400" cy="50" r="24" fill="#fde68a"/></g>
  <g id="mood-b" data-hsvg-kind="part"><circle cx="460" cy="50" r="24" fill="#a7f3d0"/></g>
  <g id="reset" data-hsvg-kind="part"><rect x="500" y="28" width="80" height="44" rx="8" fill="#e5e7eb"/></g>
</g>
<rect x="40" y="148" width="300" height="8" rx="4" fill="#9ca3af"/>
<g id="vol" data-hsvg-kind="part" data-hsvg-motion="move-x 0..300"><circle cx="40" cy="152" r="16" fill="#2563eb"/></g>
<rect x="40" y="218" width="300" height="8" rx="4" fill="#9ca3af"/>
<g id="spice" data-hsvg-kind="part" data-hsvg-motion="move-x 0..300"><rect x="24" y="210" width="32" height="24" rx="12" fill="#dc2626"/></g>
<rect x="40" y="288" width="300" height="8" rx="4" fill="#9ca3af"/>
<g id="temp" data-hsvg-kind="part" data-hsvg-motion="move-x 0..300"><circle cx="40" cy="292" r="14" fill="#059669"/></g>
<g id="go" data-hsvg-kind="part"><rect x="400" y="140" width="160" height="48" rx="24" fill="#2563eb"/><text x="480" y="171" text-anchor="middle" font-size="20" fill="#ffffff">Go</text></g>
<g id="bin-a" data-hsvg-kind="part" data-hsvg-label="Red box"><rect x="200" y="400" width="120" height="100" rx="10" fill="#fecaca"/></g>
<g id="bin-c" data-hsvg-kind="part" data-hsvg-label="Hidden box"><rect x="340" y="400" width="120" height="100" rx="10" fill="#e9d5ff"/></g>
<g id="bin-b" data-hsvg-kind="part" data-hsvg-label="Blue box"><rect x="480" y="400" width="120" height="100" rx="10" fill="#bfdbfe"/></g>
<g id="card" data-hsvg-kind="part">
  <g data-hsvg-variant="idle"><rect x="40" y="420" width="100" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/></g>
  <g data-hsvg-variant="pressed" display="none"><rect x="40" y="420" width="100" height="56" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="4"/></g>
  <text x="90" y="454" text-anchor="middle" font-size="18" fill="#111827">Card</text>
</g>
<text id="status" data-hsvg-kind="part" x="40" y="380" font-size="18" fill="#111827">Nothing yet</text>
</svg>
