<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" data-hsvg-version="2.0" data-hsvg-kind="screen">
<title>Step one</title>
<rect width="640" height="480" fill="#f3f4f6" data-hsvg-layer="backdrop" data-hsvg-color="surface"/>
<g id="next" data-hsvg-kind="part"><rect x="460" y="400" width="140" height="48" rx="24" fill="#2563eb"/><text x="530" y="431" text-anchor="middle" font-size="20" fill="#ffffff">Next</text></g>
<g id="flip" data-hsvg-kind="part"><rect x="40" y="400" width="140" height="48" rx="8" fill="#e5e7eb"/><text x="110" y="431" text-anchor="middle" font-size="18" fill="#111827">On / off</text></g>
<g id="act" data-hsvg-kind="part">
  <g data-hsvg-variant="idle"><rect x="40" y="40" width="140" height="48" rx="8" fill="#bfdbfe"/></g>
  <g data-hsvg-variant="focus" display="none"><rect x="40" y="40" width="140" height="48" rx="8" fill="#fde68a"/></g>
  <text x="110" y="71" text-anchor="middle" font-size="18" fill="#111827">Act</text>
</g>
<rect x="240" y="60" width="200" height="8" rx="4" fill="#9ca3af"/>
<g id="lev" data-hsvg-kind="part" data-hsvg-motion="move-x 0..200"><circle cx="240" cy="64" r="16" fill="#059669"/></g>
<circle cx="140" cy="220" r="70" fill="none" stroke="#9ca3af" stroke-width="2"/>
<g id="knob" data-hsvg-kind="part" data-hsvg-pivot="140 220" data-hsvg-motion="rotate -135..135"><circle cx="140" cy="220" r="44" fill="#374151"/><rect x="136" y="180" width="8" height="30" rx="4" fill="#fbbf24"/></g>
<g id="slot" data-hsvg-kind="part" data-hsvg-label="Slot"><rect x="440" y="180" width="140" height="90" rx="10" fill="#e9d5ff"/></g>
<g id="chip" data-hsvg-kind="part"><rect x="280" y="200" width="100" height="50" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/><text x="330" y="231" text-anchor="middle" font-size="18" fill="#111827">Chip</text></g>
</svg>
