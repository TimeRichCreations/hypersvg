<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" data-hsvg-version="2.0" data-hsvg-kind="screen">
  <title>The harbour</title>
  <rect id="sea" x="-400" y="-250" width="1600" height="1000" fill="#cfe8f3" data-hsvg-layer="backdrop"/>
  <g id="moss" data-hsvg-layer="decoration"><circle cx="20" cy="480" r="30" fill="#7fa36b"/></g>
  <g id="harbour" data-hsvg-layer="content">
    <g id="glints" data-hsvg-kind="part" data-hsvg-role="decoration"><circle cx="700" cy="420" r="4" fill="#ffffff"/></g>
    <rect id="title-box" data-hsvg-kind="part" data-hsvg-fit="" x="20" y="16" width="360" height="56" rx="8" fill="#2e7d32"/>
    <text id="title" data-hsvg-kind="part" data-hsvg-role="title" data-hsvg-text-style="heading" data-hsvg-color="fill:surface" x="36" y="56" font-family="sans-serif" font-size="32" fill="#ffffff">Ahoy!</text>
    <g id="badge" data-hsvg-kind="part" data-hsvg-role="badge" data-hsvg-label="Ten loads"><circle cx="420" cy="44" r="20" fill="#e6af42"/></g>
    <g id="flag" data-hsvg-kind="part" data-hsvg-role="flag" data-hsvg-label="Harbour flag" data-hsvg-pivot="600 140" data-hsvg-motion="lean -30..30">
      <path d="M600 140V60l50 20-50 20" fill="#d84315"/>
    </g>
    <g id="vane" data-hsvg-kind="part" data-hsvg-role="dial" data-hsvg-label="Wind" data-hsvg-pivot="720 100" data-hsvg-motion="rotate -45..45">
      <circle cx="720" cy="100" r="30" fill="#ffffff" stroke="#153b4b" stroke-width="4"/><path d="M720 100V74" stroke="#153b4b" stroke-width="6"/>
    </g>
    <g id="beam" data-hsvg-kind="part" data-hsvg-role="light">
      <g data-hsvg-variant="dim"><circle cx="520" cy="44" r="16" fill="#8a8a8a"/></g>
      <g data-hsvg-variant="bright" display="none"><circle cx="520" cy="44" r="22" fill="#ffd45e"/></g>
    </g>
    <g id="buoy-light" data-hsvg-kind="part" data-hsvg-role="light">
      <g data-hsvg-variant="on"><circle cx="760" cy="300" r="10" fill="#d84315"/></g>
      <g data-hsvg-variant="off" display="none"><circle cx="760" cy="300" r="10" fill="#5a3a30"/></g>
    </g>
    <g id="lamp" data-hsvg-kind="part" data-hsvg-role="switch" data-hsvg-label="Lamp">
      <rect x="560" y="20" width="60" height="48" rx="10" fill="#ffffff" stroke="#153b4b" stroke-width="4" data-hsvg-color="stroke:ink"/>
    </g>
    <g id="haze" data-hsvg-kind="part" data-hsvg-role="decoration" data-hsvg-motion="opacity 0.3..1"><rect x="0" y="100" width="800" height="40" fill="#ffffff" opacity="0.6"/></g>
    <g id="boat" data-hsvg-kind="part" data-hsvg-role="boat" data-hsvg-label="Boat" data-hsvg-motion="move-x 0..200">
      <path d="M60 260h140l-20 40H80z" fill="#8a5a2b"/>
    </g>
    <g id="wake" data-hsvg-kind="part" data-hsvg-role="decoration" data-hsvg-follow="boat"><path d="M40 300h20" stroke="#ffffff" stroke-width="4"/></g>
    <g id="wheel" data-hsvg-kind="part" data-hsvg-role="wheel" data-hsvg-pivot="130 240" data-hsvg-motion="rotate *">
      <circle cx="130" cy="240" r="16" fill="none" stroke="#153b4b" stroke-width="4"/><path d="M114 240h32M130 224v32" stroke="#153b4b" stroke-width="3"/>
    </g>
    <path id="gull-path" data-hsvg-kind="part" data-hsvg-route="track" d="M250 180C350 120 450 120 550 180" fill="none"/>
    <g id="gull" data-hsvg-kind="part" data-hsvg-role="bird" data-hsvg-label="Gull" data-hsvg-pivot="250 180">
      <path d="M235 180q8-10 15 0q7-10 15 0" fill="none" stroke="#153b4b" stroke-width="3"/>
    </g>
    <path id="trail" data-hsvg-kind="part" data-hsvg-role="trail" data-hsvg-motion="draw 0..1" pathLength="1" d="M60 330H460" fill="none" stroke="#153b4b" stroke-width="3" stroke-dasharray="1 1"/>
    <path id="rope" data-hsvg-kind="part" data-hsvg-role="rope" data-hsvg-motion="line 1..6" d="M200 270L300 360" fill="none" stroke="#5a3a30" stroke-width="2"/>
    <g id="curtain" data-hsvg-kind="part" data-hsvg-role="curtain" data-hsvg-motion="wipe 0..1"><rect x="480" y="200" width="120" height="80" fill="#d84315"/></g>
    <g id="handle" data-hsvg-kind="part" data-hsvg-role="handle" data-hsvg-motion="move-x 0..200"><circle cx="40" cy="470" r="14" fill="#153b4b"/></g>
    <g id="card-a" data-hsvg-kind="part" data-hsvg-role="card" data-hsvg-label="Short route"><rect x="320" y="380" width="80" height="50" rx="6" fill="#ffffff"/></g>
    <g id="card-b" data-hsvg-kind="part" data-hsvg-role="card" data-hsvg-label="Long route"><rect x="410" y="380" width="80" height="50" rx="6" fill="#ffffff"/></g>
    <g id="parcel" data-hsvg-kind="part" data-hsvg-role="parcel" data-hsvg-label="Parcel"><rect x="620" y="360" width="50" height="40" fill="#b5803d"/></g>
    <g id="basket" data-hsvg-kind="part" data-hsvg-role="basket" data-hsvg-label="Basket"><rect x="680" y="420" width="90" height="60" fill="none" stroke="#5a3a30" stroke-width="4"/></g>
    <g id="bin" data-hsvg-kind="part" data-hsvg-role="bin" data-hsvg-label="Bin"><rect x="520" y="420" width="70" height="60" fill="#8a8a8a"/></g>
    <g id="go" data-hsvg-kind="part" data-hsvg-role="action" data-hsvg-label="Load">
      <rect x="220" y="430" width="90" height="50" rx="25" fill="#d84315" data-hsvg-color="accent"/>
      <text x="265" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff" data-hsvg-color="fill:surface">Load</text>
    </g>
    <g id="lead-spot" data-hsvg-kind="part" data-hsvg-slot="lead-spot" transform="translate(40 120)"/>
    <g id="spare-spot" data-hsvg-kind="part" data-hsvg-slot="spare-spot" transform="translate(120 120)"/>
    <g id="crates" data-hsvg-kind="part" data-hsvg-repeat="">
      <g id="crate-1" data-hsvg-kind="part" data-hsvg-slot="crate-1" transform="translate(300 260)"/>
      <g id="crate-2" data-hsvg-kind="part" data-hsvg-slot="crate-2" transform="translate(360 260)"/>
      <g id="crate-3" data-hsvg-kind="part" data-hsvg-slot="crate-3" transform="translate(420 260)"/>
    </g>
  </g>
</svg>
