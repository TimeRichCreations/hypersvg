<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>An animated preview of the starter lamp: the switch is pressed, the bulb lights, the words change</title>
  <style>
    .on, .word-off { animation: show 4s steps(1, end) infinite; }
    .off, .word-on { animation: hide 4s steps(1, end) infinite; }
    .press { animation: press 4s ease-in-out infinite; transform-origin: 200px 245px; }
    .tap { animation: tap 4s ease-out infinite; transform-origin: 236px 258px; }
    @keyframes show { 0%, 49.9% { opacity: 0; } 50%, 99.9% { opacity: 1; } }
    @keyframes hide { 0%, 49.9% { opacity: 1; } 50%, 99.9% { opacity: 0; } }
    @keyframes press { 0%, 44%, 52%, 94%, 100% { transform: scale(1); } 47%, 97% { transform: scale(0.94); } }
    @keyframes tap { 0%, 40%, 55%, 90%, 100% { opacity: 0; transform: scale(0.6); } 46%, 96% { opacity: 0.9; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .on, .off, .word-on, .word-off, .press, .tap { animation: none; } .on, .word-off, .tap { opacity: 0; } }
  </style>
  <rect width="400" height="300" fill="#1d2b36"/>
  <circle class="off" cx="200" cy="110" r="50" fill="#555555"/>
  <circle class="on" cx="200" cy="110" r="50" fill="#ffd45e" opacity="0"/>
  <rect x="185" y="160" width="30" height="20" fill="#8d6e63"/>
  <g class="press">
    <rect x="140" y="220" width="120" height="50" rx="25" fill="#d84315"/>
    <text class="word-on" x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff">Turn on</text>
    <text class="word-off" x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff" opacity="0">Turn off</text>
  </g>
  <circle class="tap" cx="236" cy="258" r="14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0"/>
</svg>
